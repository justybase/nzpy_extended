[package]
name = "nzpy_rust_ext-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.nzpy_rust_ext]
path = ".."

[[bin]]
name = "fuzz_frames"
path = "fuzz_targets/fuzz_frames.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_layout"
path = "fuzz_targets/fuzz_layout.rs"
test = false
doc = false
bench = false

# Keep the fuzz crate out of any enclosing workspace.
[workspace]
