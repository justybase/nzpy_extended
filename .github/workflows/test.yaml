name: Test

# CI runs without a live Netezza instance: unit tests, type checks, and import smoke only.
# Integration tests (markers smoke/full) require NZ_DEV_* env vars and must be run locally.
# Native jobs need a Rust toolchain; the pure-Python variant tests the source directly.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:
    inputs:
      full_matrix:
        description: "Run every Python, OS and decoder combination"
        type: boolean
        default: false
  workflow_call:

jobs:
  # The usual run covers each Python on Linux, the oldest and newest Python on the
  # other systems, and pure Python once. The weekly run covers every combination.
  unit-matrix:
    name: Select unit test matrix
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.select.outputs.include }}
    steps:
      - id: select
        env:
          FULL: ${{ github.event_name == 'schedule' || inputs.full_matrix == true }}
        shell: python
        run: |
          import json
          import os

          versions = ["3.11", "3.12", "3.13", "3.14", "3.15"]
          systems = ["ubuntu-latest", "windows-latest", "macos-latest"]
          if os.environ["FULL"] == "true":
              combos = [(v, s, m) for v in versions for s in systems for m in ("0", "1")]
          else:
              combos = [(v, "ubuntu-latest", "0") for v in versions]
              combos.append(("3.11", "ubuntu-latest", "1"))
              combos += [(v, s, "0") for v in ("3.11", "3.15") for s in systems[1:]]
          include = [{"python-version": v, "os": s, "no-native": m} for v, s, m in combos]
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"include={json.dumps(include)}\n")

  unit:
    name: Unit tests (Python ${{ matrix.python-version }}, ${{ matrix.os }}, ${{ matrix.no-native == '1' && 'pure Python' || 'native' }})
    needs: unit-matrix
    runs-on: ${{ matrix.os }}
    env:
      NZPY_EXTENDED_NO_NATIVE: ${{ matrix.no-native }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.unit-matrix.outputs.include) }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        if: matrix.no-native == '0'
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Install test dependencies only (pure Python)
        if: matrix.no-native == '1'
        run: |
          python -m pip install --upgrade pip
          pip install scramp looseversion pytest pytest-asyncio pytest-timeout pytest-cov psutil

      - name: Run unit tests
        env:
          PYTHONPATH: ${{ matrix.no-native == '1' && github.workspace || '' }}
        run: |
          python -c "import os; from nzpy_extended._native import _HAVE_NATIVE; assert _HAVE_NATIVE == (os.environ['NZPY_EXTENDED_NO_NATIVE'] == '0')"
          pytest tests -m unit -v --tb=short --strict-config --cov=nzpy_extended --cov-branch --cov-report=term --cov-report=xml
        shell: bash

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.python-version }}-${{ matrix.no-native }}
          path: coverage.xml

  rust:
    name: Rust crate (fmt, clippy, unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: fmt
        working-directory: rust
        run: cargo fmt --check

      - name: clippy
        working-directory: rust
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        working-directory: rust
        run: cargo test --lib

  lint:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and lint dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[lint]"

      - name: mypy
        run: mypy nzpy_extended

      - name: pyright
        run: pyright --pythonpath "$(python -c 'import sys; print(sys.executable)')" nzpy_extended

  import-smoke:
    name: Build and import smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build and install wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
          pip install dist/*.whl

      - name: Verify stable ABI wheel tag
        shell: bash
        run: |
          WHL=$(ls dist/*.whl)
          echo "$WHL"
          case "$WHL" in
            *cp311-abi3-*) ;;
            *) echo "expected a cp311-abi3 wheel, got $WHL" >&2; exit 1 ;;
          esac

      - name: Import smoke
        working-directory: ${{ runner.temp }}
        run: |
          python -c "
          import nzpy_extended
          from nzpy_extended import _native
          print('version:', nzpy_extended.__version__)
          print('native decoder:', _native._native_ext.__name__ if _native._native_ext else None)
          assert _native._HAVE_NATIVE
          assert _native._native_ext.__name__ == 'nzpy_extended.rust_ext'
          assert nzpy_extended.__version__ != '0+unknown'
          "

      - name: Build and install sdist
        run: |
          python -m build --sdist
          pip install --force-reinstall dist/*.tar.gz

      - name: Import smoke (sdist)
        working-directory: ${{ runner.temp }}
        run: |
          python -c "
          import nzpy_extended
          from nzpy_extended import _native
          assert _native._HAVE_NATIVE
          assert nzpy_extended.__version__ != '0+unknown'
          "
