name: Publish to PyPI

on:
  push:
    tags: ["*"]
  release:
    types: [published]
  workflow_dispatch:

jobs:
  quality:
    uses: ./.github/workflows/test.yaml
  build-wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.23
        env:
          CIBW_ARCHS_LINUX: x86_64
          CIBW_ARCHS_MACOS: arm64 universal2
          CIBW_ARCHS_WINDOWS: AMD64 ARM64
          CIBW_BUILD: cp312-* cp313-* cp314-*

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  build-sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist
        run: |
          pip install build setuptools wheel
          python -m build --sdist

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist/*.tar.gz

  publish:
    name: Publish to PyPI
    needs: [quality, build-wheels, build-sdist]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist/

      - name: List distributions
        run: ls -la dist/

      - name: Verify sdist installs with correct version
        run: |
          python -m venv /tmp/sdist-test-venv
          /tmp/sdist-test-venv/bin/pip install --upgrade pip
          SDIST=$(ls dist/*.tar.gz | head -1)
          /tmp/sdist-test-venv/bin/pip install "$SDIST" --no-binary nzpy-extended
          /tmp/sdist-test-venv/bin/python -c "import nzpy_extended; v=nzpy_extended.__version__; assert v and v != '0+unknown', v"

      - uses: pypa/gh-action-pypi-publish@release/v1
