[build-system]
requires = ["maturin>=1.16,<2"]
build-backend = "maturin"

[project]
name = "nzpy_extended"
dynamic = ["version"]
description = "IBM Netezza python driver - extended fork"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [
    {name = "krzysztof-d"},
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Implementation :: CPython",
    "Operating System :: OS Independent",
    "Topic :: Database :: Front-Ends",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "scramp>=1.4.5",
    "looseversion>=1.3.0",
]
keywords = ["Netezza", "nps", "db-api", "dbapi", "driver", "async", "ibm-netezza", "postgresql", "extended"]

[project.urls]
Documentation = "https://github.com/justybase/nzpy_extended/tree/main/docs"
Source = "https://github.com/justybase/nzpy_extended"
Tracker = "https://github.com/justybase/nzpy_extended/issues"
Changelog = "https://github.com/justybase/nzpy_extended/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-asyncio",
    "pytest-timeout",
    "pytest-cov",
    "psutil",
]
lint = [
    "mypy>=1.13",
    "pyright>=1.1",
]

[tool.maturin]
python-source = "."
module-name = "nzpy_extended.rust_ext"
manifest-path = "rust/Cargo.toml"
features = ["extension-module"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "nzpy_extended.fastapi"
ignore_errors = true

[[tool.mypy.overrides]]
module = "nzpy_extended.csv_import"
disallow_untyped_defs = false

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
reportUnknownParameterType = "warning"
reportUnknownVariableType = "warning"
reportUnknownMemberType = "warning"
reportUnknownArgumentType = "warning"
reportPrivateUsage = "warning"
reportUnusedImport = "warning"
reportUnnecessaryComparison = false
reportUnnecessaryIsInstance = false
reportConstantRedefinition = false
reportUnusedFunction = false
reportDeprecated = false
reportPossiblyUnboundVariable = false
reportGeneralTypeIssues = "error"
reportAttributeAccessIssue = "error"
reportUndefinedVariable = "error"
