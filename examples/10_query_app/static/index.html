<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>nzpy_extended — SQL Editor</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>

<!-- ═══════════════ TOOLBAR ═══════════════ -->
<div id="toolbar">
    <button id="btn-run" title="Run SQL (Ctrl+Enter)">▶ Run</button>
    <button id="btn-cancel" class="danger" disabled title="Cancel running query">■ Cancel</button>
    <span class="separator"></span>
    <label for="timeout-input">Timeout (s):</label>
    <input id="timeout-input" type="number" value="30" min="0" step="1">
    <button id="btn-export" class="secondary" title="Export active SQL results to CSV">📥 Export</button>
    <button id="btn-import" class="secondary" title="Import CSV">📤 Import</button>
    <div class="spacer"></div>
    <span id="status-dot" class="status-dot idle"></span>
    <span id="status-text">Ready</span>
</div>

<!-- ═══════════════ SQL TABS ═══════════════ -->
<div id="sql-tab-bar">
    <button id="btn-add-tab" title="New SQL tab">+ New tab</button>
</div>

<!-- ═══════════════ SCHEMA + EDITOR ═══════════════ -->
<div id="main-split">
    <div id="schema-sidebar">
        <div class="side-head">
            <input id="schema-search" type="text" placeholder="Search tables… (dbl-click inserts)">
            <button id="btn-schema-refresh" title="Reload schema from database">⟳</button>
        </div>
        <div id="schema-tree"></div>
        <div id="schema-detail"><p>Select a table to preview columns, distribution key and size.</p></div>
    </div>
    <div id="editor-container"></div>
</div>

<!-- ═══════════════ RESULTS ═══════════════ -->
<div id="results-container">
    <div id="result-tab-bar">
        <span id="results-count">No results</span>
    </div>
    <div id="results-error" style="display:none"></div>
    <div id="table-scroll-container"></div>
    <div id="loading-overlay"></div>
</div>

<!-- ═══════════════ IMPORT DIALOG ═══════════════ -->
<div id="import-dialog">
    <div class="dialog-box">
        <h3>Import CSV</h3>
        <label>Target table name:</label>
        <input id="import-table" type="text" placeholder="my_table">
        <label>CSV file:</label>
        <input id="import-file" type="file" accept=".csv,.txt,.tsv">
        <label>Delimiter:</label>
        <input id="import-delimiter" type="text" value="," maxlength="1">
        <div class="dialog-actions">
            <button id="btn-import-cancel" class="secondary">Cancel</button>
            <button id="btn-import-do" class="primary">Import</button>
        </div>
    </div>
</div>

<div id="toast"></div>

<script>
    var require = {
        paths: { vs: "https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs" }
    };
</script>
<script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs/loader.js"></script>
<script type="module" src="/static/js/main.js"></script>

</body>
</html>
